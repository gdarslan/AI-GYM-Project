# Streamlit settings for this project.
[server]
# Don't ask for an e-mail address on first start (it blocks the terminal); start_app.bat opens the browser instead.
headless = true
# Only this computer can open the app: it holds health-related data, so it is not shared on the network.
address = "localhost"

[browser]
gatherUsageStats = false

[client]
# Hide the developer menu and Deploy button; the running indicator in the top right stays.
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#E11D2E"
backgroundColor = "#0B0B0D"
secondaryBackgroundColor = "#16161B"
textColor = "#F4F4F5"
